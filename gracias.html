<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>¡Mensaje Enviado! | Gerson Villar - Prevención de Riesgos</title>

    <!-- Control de Motores de Búsqueda (Sin Indexar) -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/favicon.png" />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Estilos Personalizados del Sitio -->
    <link rel="stylesheet" href="css/styles.css" />

    <style>
      /* Variables de color */
      :root {
        --bg-body: #fff;
        --primary-color: #40953d;
        --secondary-color: #82cc76;
        --tertiary-color: #fccd2a;
        --text-blue: #2d3055;
        --bone-white: #fffdf6;
      }

      body {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        min-height: 100vh;
      }

      /* Tarjeta reducida a 460px máximo */
      .thank-you-card {
        background-color: var(--bone-white);
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
        max-width: 460px;
        width: 100%;
        color: var(--text-blue);
      }

      /* Ícono más moderado (60px) */
      .icon-box {
        width: 60px;
        height: 60px;
        background-color: rgba(130, 204, 118, 0.25);
        color: var(--primary-color);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        margin-bottom: 1rem;
      }

      .text-title {
        color: var(--text-blue);
        font-size: 1.25rem;
      }

      .info-box {
        background-color: rgba(45, 48, 85, 0.05);
        border-left: 3px solid var(--primary-color);
        font-size: 0.85rem;
      }

      /* Botón compacto */
      .btn-custom-primary {
        background-color: var(--primary-color);
        color: #ffffff;
        border: none;
        padding: 0.5rem 1.5rem;
        border-radius: 0.4rem;
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
      }

      .btn-custom-primary:hover {
        background-color: #337830;
        color: #ffffff;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body class="d-flex align-items-center justify-content-center p-3">
    <main class="thank-you-card text-center p-4 my-auto">
      <!-- Ícono -->
      <div class="icon-box">
        <i class="bi bi-check-circle-fill"></i>
      </div>

      <!-- Título Principal -->
      <h1 class="fw-bold text-title mb-2">¡Mensaje Recibido con Éxito!</h1>

      <!-- Mensaje informativo -->
      <p class="text-muted small mb-3">
        Gracias por contactarme. He recibido la información de tu solicitud y me
        pondré en contacto contigo a la brevedad.
      </p>

      <!-- Información de firma -->
      <div class="p-3 info-box rounded-3 mb-4 text-start">
        <div class="d-flex align-items-center gap-2">
          <i
            class="bi bi-shield-check fs-5"
            style="color: var(--primary-color)"
          ></i>
          <div>
            <strong style="color: var(--text-blue)">Gerson Villar</strong><br />
            <span class="text-muted"
              >Asesoría y Gestión en Prevención de Riesgos Laborales · Talca y
              Región del Maule</span
            >
          </div>
        </div>
      </div>

      <!-- Botón Volver -->
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <a href="/" class="btn btn-custom-primary">
          <i class="bi bi-house-door pe-1"></i> Volver al Inicio
        </a>
      </div>
    </main>
  </body>
</html>
